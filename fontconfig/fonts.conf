<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Default fonts on Linux: Apple's SF Pro Text, New York Small and SF Mono (install_apple_fonts in setup/lib.sh).
  Apps that ask for "sans-serif", "serif" or "monospace" get these; characters they don't have
  (CJK, emoji) still come from Noto. Linked via ~/.config/fontconfig. Check: fc-match sans-serif
  SF Pro Text and New York Small, not the variable "SF Pro" and "New York": those default to
  their designs for large text, spaced tightly, so body text (e.g. in Firefox) looks squished.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>SF Pro Text</family></prefer>
  </alias>
  <!-- Emoji in colour: without this they come from DejaVu Sans, in black and white. A plain <prefer>
       isn't enough: fontconfig 2.18 ranks fonts of the same kind (sans-serif) above Noto Color
       Emoji first, so the preference has to be strong. Check: fc-match 'sans-serif:charset=1F600' -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>SF Pro Text</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <!-- What apps and websites call "the desktop's UI font"; fontconfig's default is Adwaita Sans.
       Strong for the same reason as above. Check: fc-match 'system\-ui' -->
  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string></edit>
  </match>
  <alias>
    <family>serif</family>
    <prefer><family>New York Small</family></prefer>
  </alias>
  <!-- fontconfig 2.18 can't tell New York Small is a serif font, and then never picks it for
       "serif". Mark it while scanning; takes effect after fc-cache -f -->
  <match target="scan">
    <test name="family"><string>New York Small</string></test>
    <edit name="genericfamily" mode="assign"><const>serif</const></edit>
  </match>
  <alias>
    <family>monospace</family>
    <prefer><family>SF Mono</family></prefer>
  </alias>
</fontconfig>
