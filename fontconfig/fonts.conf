<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Default fonts on Linux: Apple's SF Pro, New York and SF Mono (install_apple_fonts in setup/lib.sh).
  Apps that ask for "sans-serif", "serif" or "monospace" get these; characters they don't have
  (CJK, emoji) still come from Noto. Linked via ~/.config/fontconfig. Check: fc-match sans-serif
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>SF Pro</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>New York</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>SF Mono</family></prefer>
  </alias>
</fontconfig>
