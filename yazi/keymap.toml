#:schema https://yazi-rs.github.io/schemas/keymap.json

# Only my own keys; they take priority over yazi's defaults, which stay as they are:
# https://github.com/sxyazi/yazi/blob/main/yazi-config/preset/keymap-default.toml

[mgr]
prepend_keymap = [
	{ on = "A",     run = "create --dir", desc = "Create a directory" },
	{ on = "<C-x>", run = "shell -- dragon-drop --all-compact --and-exit --icon-only --on-top %s", desc = "Drag and drop selected files (dragon-drop, Linux)" },
]
