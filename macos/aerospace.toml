# AeroSpace config, linked to ~/.config/aerospace/aerospace.toml by setup/link.sh.
# There must be no ~/.aerospace.toml as well; AeroSpace reports two configs as an error.
# Guide: https://nikitabobko.github.io/AeroSpace/guide
# Commands: https://nikitabobko.github.io/AeroSpace/commands

config-version = 2

start-at-login = true

# Apply changes on save (starts working after one manual reload: alt-shift-; then esc)
auto-reload-config = true

after-startup-command = []
on-mode-changed = []

# See https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See https://nikitabobko.github.io/AeroSpace/guide#layouts
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto' # horizontal on wide monitors, vertical on tall ones

# cmd-h (hide app) is undone right away; hidden apps don't fit a tiling layout
automatically-unhide-macos-hidden-apps = true

focus-follows-mouse.enabled = true

key-mapping.preset = 'qwerty'

gaps.inner.horizontal = 8
gaps.inner.vertical =   8
gaps.outer.left =       8
gaps.outer.bottom =     8
gaps.outer.top =        8
gaps.outer.right =      8


# ----------------------------------------
# - Main mode                            -
# ----------------------------------------

[mode.main.binding]

# Terminal: ghostty / ghostty with tmux
alt-enter = 'exec-and-forget open -n /Applications/Ghostty.app'
alt-shift-enter = 'exec-and-forget open -n /Applications/Ghostty.app --args -e tmux'

# Layout: tiles / accordion (press again to switch orientation)
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Focus and move with vim keys
alt-h = 'focus --boundaries all-monitors-outer-frame left'
alt-j = 'focus --boundaries all-monitors-outer-frame down'
alt-k = 'focus --boundaries all-monitors-outer-frame up'
alt-l = 'focus --boundaries all-monitors-outer-frame right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Workspaces 1-9: go to / move window to
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

alt-leftSquareBracket = 'workspace prev'
alt-rightSquareBracket = 'workspace next'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-node-to-monitor --wrap-around next'   # move the window to the other monitor
                                                              # (workspaces are pinned, so they can't move)

# Modes (defined below)
alt-shift-semicolon = 'mode service'
alt-space = 'mode applications'


# Workspaces 1-5 on the main monitor, 6-9 on the secondary one
[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'main'
6 = 'secondary'
7 = 'secondary'
8 = 'secondary'
9 = 'secondary'


# ----------------------------------------
# - Service mode: alt-shift-;            -
# ----------------------------------------

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']           # reset layout
f = ['layout floating tiling', 'mode main']           # toggle floating / tiling
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

down = 'volume down'
up = 'volume up'
shift-down = ['volume set 0', 'mode main']


# ----------------------------------------
# - Applications mode: alt-space         -
# ----------------------------------------

[mode.applications.binding]
esc = 'mode main'
f = ['exec-and-forget open -n /Applications/"Firefox Developer Edition.app"', 'mode main']
c = ['exec-and-forget open -n /Applications/"Google Chrome Dev.app"', 'mode main']
o = ['exec-and-forget open -n /Applications/"Obsidian.app"', 'mode main']


# ----------------------------------------
# - Window rules                         -
# ----------------------------------------

# CAD / 3D-printing apps open as floating windows
[[on-window-detected]]
if.app-id = 'com.autodesk.fusion'      # Autodesk Fusion (current name)
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.autodesk.fusion360'   # Fusion 360 (older versions)
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.bambulab.bambu-studio'
run = 'layout floating'
