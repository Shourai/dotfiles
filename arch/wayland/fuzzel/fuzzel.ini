# fuzzel: app launcher (SUPER+D). Changes apply the next time it opens.
# Options: man fuzzel.ini. Check: fuzzel --check-config

[main]
font=SF Pro Text:size=11
terminal=ghostty -e

# One Dark, same palette as waybar. Format: RRGGBBAA
[colors]
background=282c34ee
text=abb2bfff
match=61afefff
selection=393f4aff
selection-text=dcdfe4ff
border=61afefff

# Same rounding as Hyprland's windows
[border]
radius=10
width=1
