# fuzzel: app launcher (SUPER+D). Changes apply the next time it opens.
# Options: man fuzzel.ini. Check: fuzzel --check-config

[main]
font=SF Pro Text:size=16
terminal=ghostty -e
# Window size: width in characters (default 30); padding in pixels
width=50
horizontal-pad=32
vertical-pad=16
inner-pad=10

# One Dark, same palette as waybar. Format: RRGGBBAA
[colors]
background=282c34ee
text=abb2bfff
match=61afefff
selection=393f4aff
selection-text=dcdfe4ff
border=61afefff

# Same rounding as Hyprland's windows
[border]
radius=10
width=1
