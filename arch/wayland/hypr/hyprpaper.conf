# hyprpaper: wallpaper. Linked via ~/.config/hypr; started by hyprland.lua.
# Changes apply after restarting hyprpaper (or logging out and in).
# The path assumes the repo is at ~/Documents/github/dotfiles.

wallpaper {
    monitor =
    path = ~/Documents/github/dotfiles/arch/wayland/hypr/wallpaper.png
    fit_mode = cover
}
splash = false
