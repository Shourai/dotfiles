# Homebrew on the PATH of the whole desktop session (systemd user environment), so things
# GNOME starts without a shell (the shortcuts in shortcuts.sh, so the tmux server and its
# popups) find Homebrew's tools. Linked to ~/.config/environment.d/ by setup/link.sh;
# takes effect at the next login.
#
# Appended, not prepended: desktop apps keep Ubuntu's python3, perl, ... first (see README.md,
# Watch out). Shells still put Homebrew first (zsh/.zshrc).
PATH=${PATH}:/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin
