# ==========================
# ===  General settings  ===
# ==========================

set-option -g mouse on

# reload configuration
bind r source-file ~/.config/tmux/tmux.conf \; display '~/.config/tmux/tmux.conf sourced'

#set-option -g default-terminal "screen-256color" # colors!
set-option -g default-terminal "tmux-256color" # colors!

# 24-bit colour in every outer terminal
# (indexed, so reloading the config with <prefix> r doesn't add it again)
set-option -s terminal-features[90] "*:RGB"

# set-option parent terminal title to reflect current window in tmux session
set-option -g set-titles on
set-option -g set-titles-string "#I:#W"

set-option -g automatic-rename on   # rename window to reflect current program
set-option -g renumber-windows on # renumber windows when a window is closed

# enable vi mode
set-option -g mode-keys vi

set-option -sg escape-time 0

# Start windows and panes at 1, not 0
set-option -g base-index 1
set-option -g pane-base-index 1

# Scrollback lines per pane
set-option -g history-limit 10000

# Extended keys, so programs can tell Shift+Enter, Ctrl+Enter etc. from plain keys
# (e.g. Shift+Enter = newline in Claude Code and Pi). `on` sends them only to programs
# that ask for them, so a plain shell still gets ordinary keys; `always` would send them
# to every program, which then prints garbage or loses Ctrl-C.
# As recommended by Claude Code (terminal-config docs) and Pi (tmux docs).
set -s extended-keys on
set -s extended-keys-format csi-u                       # tmux 3.5+
set -s terminal-features[91] "xterm*:extkeys"           # outer terminal (ghostty) reports them

# ==========================
# ===   Key bindings     ===
# ==========================
set-option -g set-clipboard on

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection \; display-message "Selection copied"
bind-key -T copy-mode-vi Y send-keys -X copy-line \; display-message "Line copied"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection \; display-message "Selection copied"

# Smart pane switching with awareness of Vim splits.
# https://github.com/aserowy/tmux.nvim
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Ctrl+Shift+Left/Right: previous/next window
bind-key -n C-S-Left  previous-window
bind-key -n C-S-Right next-window

# new pane/window and retain cwd
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

# Toggle statusbar
bind-key S set-option status

# Alt+p/Alt+n: move the current window one place left/right
bind-key -n M-p swap-window -t -1\; select-window -t -1
bind-key -n M-n swap-window -t +1\; select-window -t +1

# Kill pane without confirmation
bind-key x kill-pane

# Alt+h/j/k/l: resize pane (passed through to Vim when it's in the pane)
bind -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 1'
bind -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 1'
bind -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 1'
bind -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 1'

bind-key -T copy-mode-vi M-h resize-pane -L 1
bind-key -T copy-mode-vi M-j resize-pane -D 1
bind-key -T copy-mode-vi M-k resize-pane -U 1
bind-key -T copy-mode-vi M-l resize-pane -R 1

# Easily swap a pane (targeted by pane number) with the current pane
bind-key u display-panes\; command-prompt -p "pane #: "  "swap-pane -t '%%'"

# ==========================
# ===  Display settings  ===
# ==========================

# activity
set-option -g monitor-activity on
set-option -g visual-activity off

# Colours: onedark.nvim's palette (One Dark), matching ghostty's One Half Dark accents
od_fg="#abb2bf"
od_bg2="#393f4a"
od_bg3="#3b3f4c"
od_blue="#61afef"
od_yellow="#e5c07b"

set-option -g status-style 'bg=default'

set-option -g status-left ' #{session_name}  '
set-option -g status-right '%a %d %B | %H:%M #{tmux_mode_indicator}'
set-option -g status-right-length 50
set-option -g status-left-length 20

set-option -g window-status-format '#{window_index}:#{window_name}'
set-option -g window-status-current-style "fg=${od_blue}"
set-option -g window-status-current-format '#[bold]#{?window_zoomed_flag,,} #{window_index}:#{window_name}'

set-option -g window-status-activity-style "fg=${od_yellow}" # window with new output

set-option -g message-style 'bg=default'
set-option -g mode-style "bg=${od_bg2}" # Selection in copy mode and in <prefix> w/s

set-option -g pane-border-style "fg=${od_bg3}"
set-option -g pane-active-border-style "fg=${od_fg}"

set-option -g focus-events on

# Image previews (e.g. yazi) inside tmux
set-option -g allow-passthrough on
set-option -g update-environment[90] TERM          # indexed: no duplicates on reload
set-option -g update-environment[91] TERM_PROGRAM

# Closing a session's last window switches to another session instead of leaving tmux
set-option -g detach-on-destroy off


# ==========================
# ===     Plugins        ===
# ==========================
set-option -g @plugin 'tmux-plugins/tpm'

# tmux-fzf-pane-switch
set -g @plugin 'kristijan/tmux-fzf-pane-switch'

# Suspend local tmux when running tmux nested
set-option -g @plugin 'MunifTanjim/tmux-suspend'
set-option -g @plugin 'MunifTanjim/tmux-mode-indicator'

# Install tpm and the plugins on first start
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run '~/.config/tmux/plugins/tpm/tpm'
